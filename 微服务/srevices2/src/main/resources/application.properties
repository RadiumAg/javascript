spring.application.name=srevices2

# 8080 被本机 nacos 容器占用，8081 是 srevices1
server.port=8082

spring.cloud.nacos.server-addr=localhost:8848
spring.cloud.nacos.username=nacos
spring.cloud.nacos.password=nacos

spring.cloud.sentinel.transport.dashboard=localhost:8858
spring.cloud.sentinel.transport.port=8720
# 默认懒加载，要等第一次请求才上报；开了启动即注册到控制台
spring.cloud.sentinel.eager=true

# 注意属性名是 SCA 自己的 feign.sentinel.enabled，不是 spring.cloud.openfeign.sentinel.enabled
# 打开后 Feign 会被 SentinelFeign 包一层，@FeignClient 的 fallback 才生效
feign.sentinel.enabled=true
